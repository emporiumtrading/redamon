services:
  gabriel:
    image: gabriel-defender:dev
    build:
      context: .
      dockerfile: gabriel/Dockerfile
      target: production
    user: '10001:10001'
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    stdin_open: true
    tty: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
