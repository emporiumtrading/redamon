# Test-only bridge: parser has no DB network, environment, secret or evidence mount.
services:
  identity-tests:
    networks: [identity, toolbus]
    environment:
      GABRIEL_REQUIRE_TOOLBOX: '1'
  investigation-tools:
    image: gabriel-toolbox-tests:dev
    build:
      context: .
      dockerfile: gabriel/identity/Dockerfile
      target: production
      args:
        IDENTITY_BASE: ${GABRIEL_IDENTITY_BASE:-python@sha256:c4158543ecb725b99e57d129dfd43d761d4c43e4577b5e23326aabb223cf7f4e}
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 256m
    cpus: 1
    networks: [toolbus]
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=8m']
    entrypoint: [python, -m, gabriel.toolbox.server]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8450/health',timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
networks:
  toolbus:
    internal: true

