services:
  identity-tests:
    environment:
      GABRIEL_REQUIRE_HERMES: '1'
  hermes:
    environment:
      GABRIEL_HERMES_TEST_DIAGNOSTICS: '1'
    build:
      context: .
      dockerfile: gabriel/hermes/Dockerfile
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    networks: [toolbus]
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=256m']
    healthcheck:
      test: [CMD, /opt/hermes/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8451/health',timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 20
