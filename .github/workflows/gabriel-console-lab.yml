name: Gabriel real console lab
on:
  pull_request:
    paths:
      - 'tooling/scripts/gabriel_console_lab.py'
      - 'testing/gabriel_console/**'
      - 'tooling/scripts/gabriel_console_persist.sh'
      - 'gabriel/identity/**'
      - 'compose.gabriel-identity.yml'
      - '.github/workflows/gabriel-console-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consoles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tool: [iris, wazuh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure only the ephemeral Wazuh runner kernel
        if: matrix.tool == 'wazuh'
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Prepare generated private console and resolve image digests
        run: python3 tooling/scripts/gabriel_console_lab.py prepare '${{ matrix.tool }}' "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}"
      - name: Start the real console and verify trusted localhost HTTPS
        run: python3 tooling/scripts/gabriel_console_lab.py up '${{ matrix.tool }}' "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}"
      - name: Build isolated browser discovery harness
        run: docker build --build-arg "LAB_UID=$(id -u)" -f testing/gabriel_console/Dockerfile -t gabriel-console-browser .
      - name: Initialize shared Wazuh dashboard objects with the generated operator
        if: matrix.tool == 'wazuh'
        run: |
          mkdir -m 700 "$RUNNER_TEMP/gabriel-console-bootstrap"
          docker run --rm --network host --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m --tmpfs "/home/browserlab:rw,nosuid,nodev,size=32m,uid=$(id -u),gid=$(id -g),mode=700" \
            --mount "type=bind,src=$RUNNER_TEMP/gabriel-console-wazuh/credentials.json,dst=/run/lab/credentials.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/gabriel-console-wazuh/tls/server.pem,dst=/run/lab/server.pem,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/gabriel-console-bootstrap,dst=/output" gabriel-console-browser --initialize-only
      - name: Create a separate viewer and verify backend read/write permissions
        run: python3 tooling/scripts/gabriel_console_lab.py analyst '${{ matrix.tool }}' "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}"
      - name: Verify generated syslog replay through the Wazuh collector
        if: matrix.tool == 'wazuh'
        run: python3 tooling/scripts/gabriel_console_lab.py replay wazuh "$RUNNER_TEMP/gabriel-console-wazuh"
      - name: Verify actual operator browser login and rendered pages
        run: |
          mkdir -p "$RUNNER_TEMP/gabriel-console-output"
          chmod 700 "$RUNNER_TEMP/gabriel-console-output"
          LAB_BROWSER_CREDENTIALS=analyst-credentials.json
          LAB_REPLAY_MOUNT=()
          if test '${{ matrix.tool }}' = wazuh; then
            LAB_REPLAY_MOUNT=(--mount "type=bind,src=$RUNNER_TEMP/gabriel-console-wazuh/replay.json,dst=/run/lab/replay.json,readonly")
          fi
          docker run --rm --network host --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m --tmpfs "/home/browserlab:rw,nosuid,nodev,size=32m,uid=$(id -u),gid=$(id -g),mode=700" \
            --mount "type=bind,src=$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}/$LAB_BROWSER_CREDENTIALS,dst=/run/lab/credentials.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}/tls/server.pem,dst=/run/lab/server.pem,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/gabriel-console-output,dst=/output" "${LAB_REPLAY_MOUNT[@]}" gabriel-console-browser
      - name: Reconcile browser-visible native event against generated manager alert bytes
        if: matrix.tool == 'wazuh'
        run: |
          python3 testing/gabriel_console/reconciliation_controls.py "$RUNNER_TEMP/gabriel-console-wazuh" "$RUNNER_TEMP/gabriel-console-output/browser.json"
          python3 tooling/scripts/gabriel_console_lab.py reconcile wazuh "$RUNNER_TEMP/gabriel-console-wazuh" --browser-report "$RUNNER_TEMP/gabriel-console-output/browser.json"
      - name: Review observed event with twelve local specialist kernels
        if: matrix.tool == 'wazuh'
        run: |
          docker build --target runtime -f gabriel/identity/Dockerfile -t gabriel-specialist-demo .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 512m --cpus 1 \
            --user "$(id -u):$(id -g)" --env PYTHONPATH=/app --entrypoint python \
            --mount "type=bind,src=$GITHUB_WORKSPACE/testing/gabriel_console/presentation_bridge.py,dst=/bridge.py,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/gabriel-console-output,dst=/output" gabriel-specialist-demo /bridge.py
      - name: Persist generated case and twelve receipts and verify PostgreSQL restart
        if: matrix.tool == 'wazuh'
        run: bash tooling/scripts/gabriel_console_persist.sh "$RUNNER_TEMP/gabriel-console-output"
      - name: Render and verify the offline presentation report
        if: matrix.tool == 'wazuh'
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m --tmpfs "/home/browserlab:rw,nosuid,nodev,size=32m,uid=$(id -u),gid=$(id -g),mode=700" --entrypoint python \
            --mount "type=bind,src=$GITHUB_WORKSPACE/testing/gabriel_console/presentation_check.py,dst=/lab/presentation_check.py,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/gabriel-console-output,dst=/output" gabriel-console-browser /lab/presentation_check.py
      - name: Retain only sanitized source and image provenance
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gabriel-console-output"
          if ! test -f "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}/lab.json"; then exit 0; fi
          cp "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}/lab.json" "$RUNNER_TEMP/gabriel-console-output/lab.json"
          if test -f "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}/replay.json"; then
            cp "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}/replay.json" "$RUNNER_TEMP/gabriel-console-output/replay.json"
          fi
          if test -f "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}/analyst-access.json"; then
            cp "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}/analyst-access.json" "$RUNNER_TEMP/gabriel-console-output/analyst-access.json"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/gabriel-console-output/source-sha.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gabriel-console-${{ matrix.tool }}
          path: ${{ runner.temp }}/gabriel-console-output
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this generated lab project and its volumes
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}/lab.json"; then
            python3 tooling/scripts/gabriel_console_lab.py down '${{ matrix.tool }}' "$RUNNER_TEMP/gabriel-console-${{ matrix.tool }}"
          fi
