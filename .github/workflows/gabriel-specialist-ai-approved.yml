name: Gabriel approved specialist agent evaluation
on:
  pull_request:
    paths: ['testing/gabriel_specialist_ai/approved_trial.py', 'testing/gabriel_specialist_ai/test_approved_trial.py', '.github/workflows/gabriel-specialist-ai-approved.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build --target production -f gabriel/identity/Dockerfile -t gabriel-approved-agent-ai .
      - name: Isolated offline conditional dispatch and safety gate
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -e PYTHONPATH=/trial:/app --entrypoint python -v "$GITHUB_WORKSPACE/testing/gabriel_specialist_ai:/trial:ro" gabriel-approved-agent-ai /trial/test_approved_trial.py
  live:
    needs: software
    if: github.event.pull_request.number == 89 && github.event.action == 'opened' && github.run_attempt == '1' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/gabriel-approved-agent-ai-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    concurrency:
      group: gabriel-live-openrouter-key
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build without credentials
        run: |
          mkdir -m 700 "$RUNNER_TEMP/gabriel-approved-agent-ai"
          git rev-parse HEAD > "$RUNNER_TEMP/gabriel-approved-agent-ai/source-sha.txt"
          docker build --target production -f gabriel/identity/Dockerfile -t gabriel-approved-agent-ai .
          docker image inspect gabriel-approved-agent-ai --format '{{.Id}}' > "$RUNNER_TEMP/gabriel-approved-agent-ai/image-id.txt"
      - name: Approved conditional batch, at most 72 calls and $0.453888, no retry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          status=0
          docker run --rm --user "$(id -u):$(id -g)" --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 -e OPENROUTER_API_KEY -e PYTHONPATH=/trial:/app --entrypoint python -v "$GITHUB_WORKSPACE/testing/gabriel_specialist_ai:/trial:ro" -v "$RUNNER_TEMP/gabriel-approved-agent-ai:/results" gabriel-approved-agent-ai /trial/approved_trial.py > "$RUNNER_TEMP/gabriel-approved-agent-ai/result.jsonl" || status=$?
          cat "$RUNNER_TEMP/gabriel-approved-agent-ai/result.jsonl"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gabriel-approved-specialist-ai-summary
          path: ${{ runner.temp }}/gabriel-approved-agent-ai
          if-no-files-found: error
          retention-days: 14
