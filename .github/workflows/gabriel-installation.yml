name: Gabriel private Docker installation
on:
  pull_request:
    paths:
      - 'gabriel/identity/**'
      - 'compose.gabriel-installation.yml'
      - 'tooling/scripts/gabriel_install.py'
      - 'tooling/scripts/gabriel_acceptance.py'
      - 'testing/gabriel_acceptance/**'
      - 'tooling/scripts/gabriel_identity_prepare.py'
      - 'tooling/scripts/gabriel_provider_keys.py'
      - 'testing/gabriel_identity/installation_journey.py'
      - 'testing/gabriel_identity/installation_network_journey.py'
      - 'testing/gabriel_identity/installation_browser_journey.py'
      - '.github/workflows/gabriel-installation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize sanitized installation evidence
        run: |
          mkdir -p "$RUNNER_TEMP/gabriel-installation-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/gabriel-installation-evidence/source-sha.txt"
      - name: Build the exact non-root installation image
        run: docker build -f gabriel/identity/Dockerfile --target production -t gabriel-installation-check .
      - name: Offline acceptance fault injection
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -v "$GITHUB_WORKSPACE:/source:ro" --entrypoint python gabriel-installation-check /source/testing/gabriel_acceptance/test_runtime.py
      - name: Offline installer network failure and credential boundaries
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=8m --cap-drop ALL --security-opt no-new-privileges -v "$GITHUB_WORKSPACE:/source:ro" --entrypoint python gabriel-installation-check /source/testing/gabriel_acceptance/test_installation_network.py
      - name: Offline browser installation lifecycle and credential boundaries
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=8m --cap-drop ALL --security-opt no-new-privileges -v "$GITHUB_WORKSPACE:/source:ro" --entrypoint python gabriel-installation-check /source/testing/gabriel_acceptance/test_installation_browser.py
      - name: Deny healthy database with deliberately blocked private peer traffic
        run: |
          image_id="$(docker image inspect gabriel-installation-check --format '{{.Id}}')"
          python3 testing/gabriel_identity/installation_network_journey.py "$RUNNER_TEMP/gabriel-blocked-network-journey" "$image_id"
      - name: Fresh install, actual HTTPS, persistent evidence and fresh-project restore
        run: |
          image_id="$(docker image inspect gabriel-installation-check --format '{{.Id}}')"
          python3 testing/gabriel_identity/installation_journey.py "$RUNNER_TEMP/gabriel-installation-journey" "$image_id"
      - name: Finite browser gateway enrollment, encrypted intake, outage Stop and real expiry
        run: |
          image_id="$(docker image inspect gabriel-installation-check --format '{{.Id}}')"
          python3 testing/gabriel_identity/installation_browser_journey.py "$RUNNER_TEMP/gabriel-browser-installation-journey" "$image_id"
      - name: Retain sanitized source and installation acceptance result
        run: |
          mkdir -p "$RUNNER_TEMP/gabriel-installation-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/gabriel-installation-evidence/source-sha.txt"
          docker image inspect gabriel-installation-check --format '{{.Id}}' > "$RUNNER_TEMP/gabriel-installation-evidence/image-id.txt"
          cp "$RUNNER_TEMP/gabriel-installation-journey/browser-ai-readiness.json" "$RUNNER_TEMP/gabriel-installation-evidence/browser-ai-readiness.json"
          cp "$RUNNER_TEMP/gabriel-installation-journey/tls-renewal.json" "$RUNNER_TEMP/gabriel-installation-evidence/tls-renewal.json"
          cp "$RUNNER_TEMP/gabriel-installation-journey/runtime-acceptance.json" "$RUNNER_TEMP/gabriel-installation-evidence/runtime-acceptance.json"
          cp "$RUNNER_TEMP/gabriel-installation-journey/installation-network.json" "$RUNNER_TEMP/gabriel-installation-evidence/installation-network.json"
          cp "$RUNNER_TEMP/gabriel-blocked-network-journey/network-failure-result.json" "$RUNNER_TEMP/gabriel-installation-evidence/network-failure-result.json"
          cp "$RUNNER_TEMP/gabriel-browser-installation-journey/browser-installation-result.json" "$RUNNER_TEMP/gabriel-installation-evidence/browser-installation-result.json"
          cp "$RUNNER_TEMP/gabriel-browser-installation-journey/browser-runtime-acceptance.json" "$RUNNER_TEMP/gabriel-installation-evidence/browser-runtime-acceptance.json"
          printf '%s\n' 'PASS: generated-data local Docker installation and fresh-project restore; production and native OS acceptance pending' > "$RUNNER_TEMP/gabriel-installation-evidence/result.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gabriel-installation-${{ matrix.runner }}
          path: ${{ runner.temp }}/gabriel-installation-evidence
          if-no-files-found: error
          retention-days: 14

