name: Gabriel reviewed AI memory context
on:
  pull_request:
    paths: ['gabriel/identity/**', 'testing/gabriel_identity/**', '.github/workflows/gabriel-reviewed-memory.yml']
permissions:
  contents: read
concurrency:
  group: gabriel-reviewed-memory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Actual PostgreSQL, encrypted history and simulated model dispatch
        shell: bash
        run: |
          set -euo pipefail
          export GABRIEL_IDENTITY_SECRET_DIR="$RUNNER_TEMP/reviewed-db"
          export GABRIEL_PROVIDER_KEY_DIR="$RUNNER_TEMP/reviewed-provider"
          export GABRIEL_EVIDENCE_KEY_DIR="$RUNNER_TEMP/reviewed-evidence"
          python3 tooling/scripts/gabriel_identity_prepare.py "$GABRIEL_IDENTITY_SECRET_DIR"
          python3 tooling/scripts/gabriel_provider_keys.py "$GABRIEL_PROVIDER_KEY_DIR"
          python3 tooling/scripts/gabriel_evidence_keys.py "$GABRIEL_EVIDENCE_KEY_DIR"
          compose=(docker compose -p gabriel-reviewed-check -f compose.gabriel-identity.yml)
          trap '"${compose[@]}" --profile test down --volumes --remove-orphans' EXIT
          "${compose[@]}" --profile test build identity-tests
          "${compose[@]}" up -d --wait identity-db
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests -m pytest -q --assert=plain --tb=short testing/gabriel_identity/test_reviewed_memory_integration.py
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests tooling/scripts/pytest_isolated.py all testing/gabriel_identity/test_specialist_agents.py testing/gabriel_identity/test_specialist_agents_integration.py testing/gabriel_identity/test_model_worker_integration.py testing/gabriel_identity/test_model_budget_integration.py --strict --parallel 1
