name: Gabriel mandatory Hermes SDK compatibility
on:
  pull_request:
    paths: ['testing/gabriel_hermes/**', '.github/workflows/gabriel-hermes-sdk.yml']
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve official stable Hermes image and retain immutable identity
        run: |
          mkdir -m 700 "$RUNNER_TEMP/hermes-sdk"
          image_digest="$(docker buildx imagetools inspect nousresearch/hermes-agent:stable --format '{{.Manifest.Digest}}')"
          echo "HERMES_IMAGE=nousresearch/hermes-agent@$image_digest" >> "$GITHUB_ENV"
          docker pull "nousresearch/hermes-agent@$image_digest"
          docker image inspect "nousresearch/hermes-agent@$image_digest" --format '{{json .Config.Labels}}' > "$RUNNER_TEMP/hermes-sdk/image-labels.json"
          printf '%s\n' "$image_digest" > "$RUNNER_TEMP/hermes-sdk/image-digest.txt"
      - name: Genuine Hermes agent loop with offline client and no provider credentials
        env:
          GABRIEL_HERMES_SOURCE: bf0203a794a07aac3ff764972ab9087baa4e4f4e
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
            -e HERMES_HOME=/tmp/hermes -e HOME=/tmp/hermes-home -e GABRIEL_HERMES_SOURCE -e GABRIEL_HERMES_IMAGE="$HERMES_IMAGE" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/testing/gabriel_hermes/sdk_probe.py,dst=/probe.py,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/hermes-sdk,dst=/output" --entrypoint python "$HERMES_IMAGE" /probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gabriel-hermes-sdk-compatibility
          path: ${{ runner.temp }}/hermes-sdk
          if-no-files-found: error
          retention-days: 14
