name: Gabriel local visible-structure drafts
on:
  pull_request:
    paths: ['gabriel/identity/**', 'gabriel/browser_extension/**', 'testing/gabriel_identity/test_browser_semantics*', '.github/workflows/gabriel-visible-structure.yml']
permissions:
  contents: read
jobs:
  structure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline structural contracts and actual PostgreSQL source custody
        shell: bash
        run: |
          set -euo pipefail
          export GABRIEL_IDENTITY_SECRET_DIR="$RUNNER_TEMP/structure-db"
          export GABRIEL_PROVIDER_KEY_DIR="$RUNNER_TEMP/structure-provider"
          export GABRIEL_EVIDENCE_KEY_DIR="$RUNNER_TEMP/structure-evidence"
          python3 tooling/scripts/gabriel_identity_prepare.py "$GABRIEL_IDENTITY_SECRET_DIR"
          python3 tooling/scripts/gabriel_provider_keys.py "$GABRIEL_PROVIDER_KEY_DIR"
          python3 tooling/scripts/gabriel_evidence_keys.py "$GABRIEL_EVIDENCE_KEY_DIR"
          compose=(docker compose -p gabriel-structure-check -f compose.gabriel-identity.yml)
          trap '"${compose[@]}" --profile test down --volumes --remove-orphans' EXIT
          "${compose[@]}" --profile test build identity-tests
          "${compose[@]}" up -d --wait identity-db
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests tooling/scripts/pytest_isolated.py all testing/gabriel_identity/test_browser_semantics.py testing/gabriel_identity/test_browser_semantics_integration.py --strict --parallel 1
