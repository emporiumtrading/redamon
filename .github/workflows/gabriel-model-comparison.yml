name: Gabriel bounded multi-model comparison
on:
  pull_request:
    paths:
      - 'gabriel/identity/model_routes.py'
      - 'gabriel/identity/model_transport.py'
      - 'gabriel/identity/model_lab.py'
      - 'gabriel/identity/model_protocol.py'
      - 'gabriel/model_lab/**'
      - 'testing/gabriel_identity/test_model_lab.py'
      - '.github/workflows/gabriel-model-comparison.yml'
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build -f gabriel/model_lab/Dockerfile --target test -t gabriel-model-lab-tests .
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m gabriel-model-lab-tests
  live-generated-comparison:
    needs: software
    # The exact-before exception recovers a software-only failure; no paid job ran.
    if: (github.event.action == 'opened' || (github.event.action == 'synchronize' && github.event.before == 'a7206b289231a1a2df381092b40dbcae35613b8a' && github.head_ref == 'feature/gabriel-model-comparison-remaining')) && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feature/gabriel-model-worker' || github.head_ref == 'feature/gabriel-model-comparison-remaining' || github.head_ref == 'feature/gabriel-model-protocol-v2' || github.head_ref == 'feature/gabriel-model-v2-wider')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: gabriel-live-openrouter-key
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build -f gabriel/model_lab/Dockerfile --target runtime -t gabriel-model-lab .
      - name: One authorized generated-data batch; no retries or fallback
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GABRIEL_COMPARISON_REMAINING: ${{ github.head_ref == 'feature/gabriel-model-comparison-remaining' }}
          GABRIEL_COMPARISON_WIDER: ${{ github.head_ref == 'feature/gabriel-model-v2-wider' }}
          GABRIEL_COMPARISON_PROTOCOL_V2: ${{ github.head_ref == 'feature/gabriel-model-protocol-v2' }}
        run: |
          status=0
          mode_args=()
          if [[ "$GABRIEL_COMPARISON_REMAINING" == true ]]; then mode_args+=(--remaining-after-checkpoint); fi
          if [[ "$GABRIEL_COMPARISON_PROTOCOL_V2" == true ]]; then mode_args+=(--protocol-v2-development); fi
          if [[ "$GABRIEL_COMPARISON_WIDER" == true ]]; then mode_args+=(--protocol-v2-wider); fi
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 -e OPENROUTER_API_KEY gabriel-model-lab "${mode_args[@]}" > "$RUNNER_TEMP/gabriel-model-comparison.jsonl" || status=$?
          python - "$RUNNER_TEMP/gabriel-model-comparison.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[1]) if line.strip()]
          final=rows[-1] if rows else {}
          report=final.get('report',{})
          print(json.dumps({k:report.get(k) for k in ['attempted_calls','validated_calls','reported_cost_usd','carried_reported_cost_usd','carried_reserved_usd','unresolved_comparison_calls','historical_probe_reserved_usd','unknown_cost_possible','quality_qualified','production_admission']}))
          PY
          exit "$status"
      - name: Retain generated-only checkpoint journal and final results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gabriel-generated-model-comparison
          path: ${{ runner.temp }}/gabriel-model-comparison.jsonl
          if-no-files-found: error
          retention-days: 14
