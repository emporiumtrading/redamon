name: Gabriel required Hermes supervision
on:
  pull_request:
    paths: ['gabriel/identity/**', 'gabriel/hermes/**', 'testing/gabriel_identity/test_hermes*', 'testing/gabriel_identity/test_browser_hermes*', 'testing/gabriel_identity/test_workbench_hermes*', 'compose.gabriel*.yml', '.github/workflows/gabriel-hermes.yml']
permissions:
  contents: read
jobs:
  supervision:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and run required native Hermes with generated model responses
        shell: bash
        run: |
          set -euo pipefail
          export GABRIEL_IDENTITY_SECRET_DIR="$RUNNER_TEMP/hermes-db"
          export GABRIEL_PROVIDER_KEY_DIR="$RUNNER_TEMP/hermes-provider"
          export GABRIEL_EVIDENCE_KEY_DIR="$RUNNER_TEMP/hermes-evidence"
          python3 tooling/scripts/gabriel_identity_prepare.py "$GABRIEL_IDENTITY_SECRET_DIR"
          python3 tooling/scripts/gabriel_provider_keys.py "$GABRIEL_PROVIDER_KEY_DIR"
          python3 tooling/scripts/gabriel_evidence_keys.py "$GABRIEL_EVIDENCE_KEY_DIR"
          compose=(docker compose -p gabriel-hermes-check -f compose.gabriel-identity.yml -f compose.gabriel-tool-tests.yml -f compose.gabriel-hermes-tests.yml)
          trap '"${compose[@]}" --profile test down --volumes --remove-orphans' EXIT
          "${compose[@]}" --profile test build identity-tests investigation-tools hermes
          "${compose[@]}" up -d --wait identity-db investigation-tools hermes
          mkdir -p "$RUNNER_TEMP/hermes-qualification"
          git rev-parse HEAD > "$RUNNER_TEMP/hermes-qualification/source-sha.txt"
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests -m gabriel.identity.hermes_qualification --configurations > "$RUNNER_TEMP/hermes-qualification/configurations.json"
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests -m pytest -q --assert=plain --tb=short testing/gabriel_identity/test_browser_hermes_integration.py::test_two_partial_tabs_run_native_hermes_and_personal_specialists_reject_stale_replay testing/gabriel_identity/test_browser_hermes_integration.py::test_fresh_partial_tabs_replay_native_hermes_without_provider_resend testing/gabriel_identity/test_browser_hermes_integration.py::test_second_tab_change_during_provider_call_stops_without_child_dispatch
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests -m pytest -q --assert=plain --tb=short testing/gabriel_identity/test_hermes_supervisor_integration.py::test_hermes_plans_delegates_two_independent_agents_reports_and_replays
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests tooling/scripts/pytest_isolated.py all testing/gabriel_identity/test_machine_integration.py --strict --parallel 1
          if ! "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests tooling/scripts/pytest_isolated.py all testing/gabriel_identity/test_model_evaluation.py testing/gabriel_identity/test_hermes_qualification.py testing/gabriel_identity/test_hermes_supervisor.py testing/gabriel_identity/test_hermes_supervisor_integration.py testing/gabriel_identity/test_browser_hermes_integration.py testing/gabriel_identity/test_workbench_hermes_selection.py testing/gabriel_identity/test_specialist_agents.py testing/gabriel_identity/test_specialist_agents_integration.py testing/gabriel_identity/test_workbench_integration.py --strict --parallel 1; then
            "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests -m pytest -q --assert=plain --tb=short testing/gabriel_identity/test_hermes_supervisor_integration.py::test_hermes_plans_delegates_two_independent_agents_reports_and_replays || true
            "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests -m pytest -q --assert=plain --tb=short testing/gabriel_identity/test_workbench_integration.py::test_https_case_report_custody_and_explicit_content_view || true
            exit 1
          fi
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests tooling/scripts/pytest_isolated.py all testing/gabriel_identity/test_machine_integration.py --strict --parallel 1
          docker inspect gabriel-hermes-check-hermes-1 > "$RUNNER_TEMP/hermes-inspect.json"
          python3 testing/gabriel_hermes/assert_isolation.py "$RUNNER_TEMP/hermes-inspect.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gabriel-qualification-configurations-${{ matrix.os }}
          path: ${{ runner.temp }}/hermes-qualification
          if-no-files-found: error
          retention-days: 14
