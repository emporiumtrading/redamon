name: Gabriel database identity
on:
  push:
    branches: ['feature/gabriel-identity', 'feature/gabriel-service-identity', 'feature/gabriel-provider-secrets', 'feature/gabriel-durable-tasks', 'feature/gabriel-case-evidence', 'feature/gabriel-action-approvals', 'feature/gabriel-retention-holds', 'feature/gabriel-custody-checkpoints', 'feature/gabriel-checkpoint-policy', 'feature/gabriel-evidence-key-lifecycle', 'feature/gabriel-browser-pairing', 'feature/gabriel-browser-observations', 'feature/gabriel-browser-privacy-guards', 'feature/gabriel-browser-client']
    paths:
      - 'gabriel/capabilities.py'
      - 'gabriel/identity/**'
      - 'gabriel/browser_extension/**'
      - 'tooling/scripts/gabriel_extension_package.py'
      - 'testing/gabriel_identity/**'
      - 'tooling/scripts/gabriel_identity_*.py'
      - 'tooling/scripts/gabriel_provider_keys.py'
      - 'tooling/scripts/gabriel_evidence_keys.py'
      - 'tooling/scripts/gabriel_identity_check.sh'
      - 'tooling/scripts/gabriel_candidate_export.py'
      - 'compose.gabriel-identity.yml'
      - 'gabriel.sh'
      - '.github/workflows/gabriel-identity.yml'
  pull_request:
    paths:
      - 'gabriel/capabilities.py'
      - 'gabriel/identity/**'
      - 'gabriel/browser_extension/**'
      - 'tooling/scripts/gabriel_extension_package.py'
      - 'testing/gabriel_identity/**'
      - 'tooling/scripts/gabriel_identity_*.py'
      - 'tooling/scripts/gabriel_provider_keys.py'
      - 'tooling/scripts/gabriel_evidence_keys.py'
      - 'tooling/scripts/gabriel_identity_check.sh'
      - 'tooling/scripts/gabriel_candidate_export.py'
      - 'compose.gabriel-identity.yml'
      - 'gabriel.sh'
      - '.github/workflows/gabriel-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gabriel-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Database identity and restart verification
        run: |
          bash -n gabriel.sh tooling/scripts/gabriel_identity_check.sh
          bash tooling/scripts/gabriel_identity_check.sh "$RUNNER_TEMP/gabriel-identity-evidence"
      - name: Defensive runtime regression
        run: bash tooling/scripts/gabriel_runtime_check.sh "$RUNNER_TEMP/gabriel-runtime-evidence"
      - name: Foundation regression
        run: bash tooling/scripts/gabriel_foundation_check.sh "$RUNNER_TEMP/gabriel-foundation-evidence"
      - name: Export the existing checked AMD64 images
        run: >-
          python3 tooling/scripts/gabriel_candidate_export.py
          --output "$RUNNER_TEMP/gabriel-core-candidate-amd64"
          --identity-evidence "$RUNNER_TEMP/gabriel-identity-evidence"
          --runtime-evidence "$RUNNER_TEMP/gabriel-runtime-evidence"
          --foundation-evidence "$RUNNER_TEMP/gabriel-foundation-evidence"
      - name: Retain the AMD64 core test candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gabriel-core-candidate-amd64
          path: ${{ runner.temp }}/gabriel-core-candidate-amd64
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain identity evidence without credential checkpoint files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gabriel-identity-evidence
          path: |
            ${{ runner.temp }}/gabriel-identity-evidence
            ${{ runner.temp }}/gabriel-runtime-evidence
            ${{ runner.temp }}/gabriel-foundation-evidence
          if-no-files-found: warn
          retention-days: 14
