name: Gabriel open-source investigation tools and skills
on:
  pull_request:
    paths: ['gabriel/identity/**', 'gabriel/toolbox/**', 'testing/gabriel_identity/test_investigation_tools*.py', 'compose.gabriel*.yml', '.github/workflows/gabriel-investigation-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build actual offline engines, skills and isolated parser service
        shell: bash
        run: |
          set -euo pipefail
          export GABRIEL_IDENTITY_SECRET_DIR="$RUNNER_TEMP/tool-db"
          export GABRIEL_PROVIDER_KEY_DIR="$RUNNER_TEMP/tool-provider"
          export GABRIEL_EVIDENCE_KEY_DIR="$RUNNER_TEMP/tool-evidence"
          python3 tooling/scripts/gabriel_identity_prepare.py "$GABRIEL_IDENTITY_SECRET_DIR"
          python3 tooling/scripts/gabriel_provider_keys.py "$GABRIEL_PROVIDER_KEY_DIR"
          python3 tooling/scripts/gabriel_evidence_keys.py "$GABRIEL_EVIDENCE_KEY_DIR"
          compose=(docker compose -p gabriel-tool-check -f compose.gabriel-identity.yml -f compose.gabriel-tool-tests.yml)
          trap '"${compose[@]}" --profile test down --volumes --remove-orphans' EXIT
          "${compose[@]}" --profile test build identity-tests investigation-tools
          "${compose[@]}" up -d --wait identity-db investigation-tools
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests tooling/scripts/pytest_isolated.py all testing/gabriel_identity/test_machine_integration.py --strict --parallel 1
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests tooling/scripts/pytest_isolated.py all testing/gabriel_identity/test_investigation_tools.py testing/gabriel_identity/test_investigation_tools_integration.py testing/gabriel_identity/test_specialist_agents.py testing/gabriel_identity/test_specialist_agents_integration.py testing/gabriel_identity/test_workbench_integration.py --strict --parallel 1
          "${compose[@]}" --profile test run --rm --no-deps -T --entrypoint python identity-tests tooling/scripts/pytest_isolated.py all testing/gabriel_identity/test_machine_integration.py --strict --parallel 1
          docker inspect gabriel-tool-check-investigation-tools-1 > "$RUNNER_TEMP/toolbox-inspect.json"
          python3 testing/gabriel_toolbox/assert_isolation.py "$RUNNER_TEMP/toolbox-inspect.json"
